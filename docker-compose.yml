services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bookmark_manager
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://dev:dev_password@postgres:5432/bookmark_manager
      AUTH0_DOMAIN: dev-yg.us.auth0.com
      AUTH0_AUDIENCE: https://bbl-candidate-test-api
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH0_DOMAIN: dev-yg.us.auth0.com
        VITE_AUTH0_CLIENT_ID: H9F6QG5SzTKMv0tbmgxLj9LjG1EKVllA
        VITE_AUTH0_REDIRECT_URI: http://localhost:3000/callback
        VITE_AUTH0_AUDIENCE: https://bbl-candidate-test-api
        VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: