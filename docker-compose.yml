services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bookmark_manager
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://dev:dev_password@postgres:5432/bookmark_manager
      AUTH0_DOMAIN: dev-yg.us.auth0.com
      AUTH0_AUDIENCE: https://bbl-candidate-test-api
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: